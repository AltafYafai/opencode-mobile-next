# Builds the Android sideload APK on a release tag or workflow dispatch with
# the project's signing key, proves the signer matches the certificate fingerprint,
# keeps the APK as a workflow artifact, and creates or updates a GitHub release.

name: Android release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release (false = draft)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  SIDELOAD_CERT_SHA256: 0B0E936A9F62E0C9F29C606E12DE5F8FE82954DE683E024CD1C0FD324EFB9257
  FLUTTER_VERSION: "3.47.2"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require the release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE_B64" ]  || missing+=(RELEASE_KEYSTORE_BASE64)
          [ -n "$STORE_PASSWORD" ] || missing+=(RELEASE_STORE_PASSWORD)
          [ -n "$KEY_ALIAS" ]     || missing+=(RELEASE_KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ]  || missing+=(RELEASE_KEY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Release build blocked: repository secrets not set: ${missing[*]}"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*version:[[:space:]]*//p' pubspec.yaml)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[1-9][0-9]*$ ]]; then
            echo "::error::pubspec.yaml must contain exactly one version in x.y.z+positive-build-number form. Found: ${version:-<none>}"
            exit 1
          fi
          {
            echo "version=$version"
            echo "build_name=${version%%+*}"
            echo "build_number=${version##*+}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.5.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Gradle wrapper
        run: |
          set -euo pipefail
          wrapper_project="$RUNNER_TEMP/gradle-wrapper"
          mkdir -p "$wrapper_project"
          : > "$wrapper_project/settings.gradle.kts"
          gradle -p "$wrapper_project" wrapper \
            --gradle-version 9.5.0 \
            --distribution-type all \
            --gradle-distribution-sha256-sum a3c4ba4aca8f0075688b9c5b18939fd28e8cb4357c227da5c1d9f38343791439
          cp "$wrapper_project/gradlew" "$wrapper_project/gradlew.bat" android/
          cp "$wrapper_project/gradle/wrapper/gradle-wrapper.jar" \
            "$wrapper_project/gradle/wrapper/gradle-wrapper.properties" android/gradle/wrapper/

      - name: Install the release signing identity
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEYSTORE: ${{ runner.temp }}/opencode-release.jks
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          actual="$(OC_STORE_PASSWORD="$STORE_PASSWORD" keytool -J-Duser.language=en -list -v \
              -keystore "$KEYSTORE" -alias "$KEY_ALIAS" -storepass:env OC_STORE_PASSWORD |
            sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ "$actual" != "$SIDELOAD_CERT_SHA256" ]; then
            echo "::error::Keystore certificate $actual does not match SIDELOAD_CERT_SHA256 ($SIDELOAD_CERT_SHA256)"
            exit 1
          fi
          printf '%s\n' \
            "storeFile=$KEYSTORE" \
            "storePassword=$STORE_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" \
            > android/key.properties

      - name: Build release APK
        run: |
          set -euo pipefail
          rm -f build/app/outputs/flutter-apk/app-release.apk
          flutter build apk --release

      - name: Derive per-ABI APKs from the universal APK
        env:
          OC_KS: ${{ runner.temp }}/opencode-release.jks
          OC_KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          OC_KS_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          OC_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build/abi-apks
          for abi in arm64-v8a armeabi-v7a; do
            python3 tool/release/split_apk_by_abi.py \
              --apk build/app/outputs/flutter-apk/app-release.apk \
              --abi "$abi" --out "build/abi-apks/$abi.apk"
          done

      - name: Remove the signing identity
        if: always()
        run: rm -f android/key.properties "${{ runner.temp }}/opencode-release.jks"

      - name: Verify APK signer and version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          certificate_output="$("$tools/apksigner" verify --print-certs "$apk")" || {
            echo '::error::apksigner could not verify the APK'
            exit 1
          }
          printf '%s\n' "$certificate_output"
          mapfile -t signers < <(printf '%s\n' "$certificate_output" |
            sed -En 's/^(Signer #[0-9]+|V[0-9]+ Signer:|Signer \([^)]*\))[[:space:]]+certificate SHA-256 digest:[[:space:]]*//p' |
            tr '[:lower:]' '[:upper:]' | sort -u)
          [ "${#signers[@]}" = 1 ] || { echo "::error::APK has ${#signers[@]} signers, expected 1"; exit 1; }
          [ "${signers[0]}" = "$SIDELOAD_CERT_SHA256" ] || { echo "::error::APK signer ${signers[0]} is not the sideload lineage"; exit 1; }
          badging="$("$tools/aapt" dump badging "$apk" | sed -n '1p')"
          version="$VERSION"
          name="${version%%+*}"; code="${version#*+}"
          grep -q "^package: name='io.github.eslamasabry.opencode_mobile' " <<<"$badging" || { echo "::error::Package ID mismatch: $badging"; exit 1; }
          grep -q "versionCode='$code'" <<<"$badging" || { echo "::error::versionCode mismatch: $badging"; exit 1; }
          grep -q "versionName='$name'" <<<"$badging" || { echo "::error::versionName mismatch: $badging"; exit 1; }
          mkdir -p dist
          cp "$apk" "dist/opencode-mobile-$version.apk"
          for abi in arm64-v8a armeabi-v7a; do
            split="build/abi-apks/$abi.apk"
            test -s "$split"
            split_signers="$("$tools/apksigner" verify --print-certs "$split" |
              sed -En 's/^[^:]*[Ss]igner:?[^:]*certificate SHA-256 digest:[[:space:]]*//p' |
              tr '[:lower:]' '[:upper:]' | sort -u)"
            [ "$split_signers" = "$SIDELOAD_CERT_SHA256" ] || {
              "$tools/apksigner" verify --print-certs "$split" | sed -n '1,12p'
              echo "::error::$abi APK signer $split_signers is not the sideload lineage"; exit 1; }
            split_badging="$("$tools/aapt" dump badging "$split")"
            grep -q "versionCode='$code'" <<<"$split_badging" || { echo "::error::$abi versionCode mismatch"; exit 1; }
            grep -q "^native-code: '$abi'$" <<<"$split_badging" || { echo "::error::$abi APK has unexpected native code"; exit 1; }
            cp "$split" "dist/opencode-mobile-$version-$abi.apk"
          done
          (cd dist && sha256sum opencode-mobile-"$version"*.apk > SHA256SUMS)
          {
            echo "## opencode-mobile-$version.apk"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Signer SHA-256: \`$SIDELOAD_CERT_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare release notes
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          source_notes="docs/releases/v$version.md"
          if [ -s "$source_notes" ]; then
            cp "$source_notes" dist/RELEASE_NOTES.md
          else
            {
              echo "# OpenCode Mobile $version"
              echo
              echo "Release build for OpenCode Mobile $version."
            } > dist/RELEASE_NOTES.md
          fi
          {
            echo
            echo '## Verify this build'
            echo
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo '- Package ID: `io.github.eslamasabry.opencode_mobile`'
            echo "- Signer SHA-256: \`$SIDELOAD_CERT_SHA256\`"
            echo '- APK SHA-256:'
            echo '```text'
            cat dist/SHA256SUMS
            echo '```'
          } >> dist/RELEASE_NOTES.md

      - name: Upload signed APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mobile-signed-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          draft_flag=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.publish_release }}" == "false" ]]; then
            draft_flag="--draft"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              $draft_flag --prerelease=false \
              --title "OpenCode Mobile $VERSION" \
              --notes-file dist/RELEASE_NOTES.md
            gh release upload "$tag" \
              dist/opencode-mobile-"$VERSION"*.apk dist/SHA256SUMS --clobber
          else
            gh release create "$tag" \
              $draft_flag --prerelease=false \
              --target "$GITHUB_SHA" \
              --title "OpenCode Mobile $VERSION" \
              --notes-file dist/RELEASE_NOTES.md \
              dist/opencode-mobile-"$VERSION"*.apk dist/SHA256SUMS
          fi
